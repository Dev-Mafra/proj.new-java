<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Conversor de Moedas</title>
</head>

<body>
    <img class="logo" src="./assets/logo-conversor.png" alt="logo-Principal">

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option value="real" >R$ Real Brasileiro</option>
            </select>

            <label>
                Converter <b>para</b>
                <select class="currency-select">
                    <option value="dolar">US$ Dólar Americano</option>
                    <option value="canadence">C$ Dólar Canadence</option>
                    <option value="euro">€ Euro</option>
                    <option value="libra">£ Libra Esterlina</option>
                    <option value="iene">¥ Iene Japonês</option>

                </select>
            </label>
            <label>
                Valor
            
                <input class="input-currency" placeholder="R$ 10.000,00">
            </label>

            <button class="convert-button">Coverter</button>

            <section>
                <div class="currency-box">
                    <img id="currency-img-from" class="bandeira-brasil" src="./assets/real.png" alt="Moeda a Converter">
                    <p class="currency" id="currency-name-from">Real</p>
                    <p class="currency-value-to-convert">R$ 0,00</p>
                </div>

                <img class="img-seta" src="./assets/Vector.png" alt="Seta">

                <div class="currency-box">
                    <img class="bandeira-americana" src="./assets/dolar.png" alt="Moeda a Convertida">
                    <p class="currency" id="currency-name">Dolar</p>
                    <p class="currency-value">US$ 0,00</p>
                </div>
            </section>
    </main>

</body>

<script src="./arquivo.js"></script>

</html>
